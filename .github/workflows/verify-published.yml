name: verify-published

# Installs a released version from a package index with pip, in a fresh venv outside the checkout,
# on every runner OS and on the oldest and newest supported Python, then runs one conversion and one
# patro lookup (scripts/verify_published.py). release.yml calls it after each upload; it can also be
# run by hand for any version already on PyPI.
#
# Called, not triggered: a release created with GITHUB_TOKEN fires no release event.

on:
  workflow_call:
    inputs:
      version:
        description: "PyPI version, for example 0.1.0b1"
        required: true
        type: string
      index-url:
        description: "Index to install from"
        required: false
        default: "https://pypi.org/simple/"
        type: string
      extra-index-url:
        description: "Second index for dependencies, empty for none"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "PyPI version, for example 0.1.0b1"
        required: true
        type: string
      index-url:
        description: "Index to install from"
        required: false
        default: "https://pypi.org/simple/"
        type: string
      extra-index-url:
        description: "Second index for dependencies, empty for none"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install both versions with pip and run the check
        # A new upload can take minutes to reach the simple index, so the script retries the
        # install for up to 15 minutes. The inputs go through env, never into the script text.
        env:
          VERSION: ${{ inputs.version }}
          INDEX_URL: ${{ inputs.index-url }}
          EXTRA_INDEX_URL: ${{ inputs.extra-index-url }}
          PYTHON: ${{ matrix.python }}
        shell: bash
        run: >-
          uv run --no-project --python "$PYTHON" scripts/verify_published.py "$VERSION"
          --index-url "$INDEX_URL" --extra-index-url "$EXTRA_INDEX_URL" --wait-seconds 900
