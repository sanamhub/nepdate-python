name: shared-sync

on:
  schedule:
    - cron: "15 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: sanamhub/nepdate/.github/workflows/shared-sync.yml@52106eb68bdc63a51a4b3bfb1b5673faffc98c2c # main 2026-10-16
    with:
      regenerate: uv run python scripts/codegen.py
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
