name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  # shared-sync starts CI this way on the PR it opens with GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.14t" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.13" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked python scripts/ci.py

  # The 3.15 pre-release is allowed to fail (ADR-0004).
  test-prerelease:
    name: test (ubuntu-latest, 3.15 prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - run: uv run --locked python scripts/ci.py

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Read the core and patro version
        id: version
        run: |
          set -euo pipefail
          # Assigned first: a failing command inside echo's argument would not stop the step.
          if ! version="$(uv run --locked python scripts/ci.py version)"; then
            echo "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Fails when shared/ differs from the hub at the commit in shared/VERSION, and when the
  # distributions' version is on another MAJOR.MINOR line (ADR-0007).
  shared-check:
    needs: version
    permissions:
      contents: read
    uses: sanamhub/nepdate/.github/workflows/shared-check.yml@f636b7d476bc5959eb5689a950b73c8943860eef # main 2026-11-01
    with:
      sdk: python
      version: ${{ needs.version.outputs.version }}
