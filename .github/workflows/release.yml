name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to TestPyPI, as in the tag (X.Y.Z or X.Y.Z-beta.N)"
        required: true
        type: string
      dry-run:
        description: "Publish to TestPyPI instead of PyPI"
        required: true
        default: true
        type: boolean

# Read-only by default. Only the publish jobs get id-token: write. Only the github-release job
# gets contents: write, and it runs after verify, so a release page never exists for files that
# failed to install from PyPI.
permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # version is the tag and changelog spelling (0.1.0-beta.1); pypi-version is the PEP 440
    # spelling the pyprojects, wheels and pip use (0.1.0b1).
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi-version: ${{ steps.pypi.outputs.pypi-version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Resolve and validate the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "release: a push must be a tag, not $REF_TYPE" >&2
              exit 1
            fi
            VERSION="${REF_NAME#v}"
            DRY_RUN=false
          else
            VERSION="$INPUT_VERSION"
            DRY_RUN="$INPUT_DRY_RUN"
          fi
          if ! printf '%s' "$VERSION" |
            grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'; then
            echo "release: not X.Y.Z or X.Y.Z-alpha|beta|rc.N: $VERSION" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            echo "release: a dispatch publishes to TestPyPI only; PyPI needs a tag push" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the versions, dependency, changelog and data freshness
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --locked python scripts/ci.py release-check "$VERSION"
      - name: Spell the version for PyPI
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "pypi-version=$(uv run --locked python scripts/ci.py pypi-version "$VERSION")" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build both distributions once
        run: uv run --locked python scripts/ci.py build-release
      - name: Check the four files that will be published
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: uv run --locked python scripts/ci.py release-rehearsal "$VERSION" --dist dist
      - name: Sort the files by distribution
        run: uv run --locked python scripts/ci.py sort-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  mutation:
    name: mutation
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the mutation group
        run: uv sync --all-packages --group mutation
      - name: Use the mutated source, not the editable install
        run: |
          uv pip uninstall nepdate-core nepdate-patro
          cp -r packages/nepdate-patro/src/nepdate_patro src/nepdate_patro
      - name: Run mutmut
        run: .venv/bin/mutmut run --max-children 4
      - name: Export and check the result
        run: |
          .venv/bin/mutmut export-cicd-stats
          .venv/bin/mutmut results --all true > mutants/results.txt
          .venv/bin/python scripts/mutation_check.py mutants/mutmut-cicd-stats.json --results mutants/results.txt

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [parse, parse_lenient, format]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the fuzz group
        run: uv sync --all-packages --group fuzz
      - name: Run the target for 300 seconds
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-artifacts"
          uv run --no-sync python "fuzz/fuzz_${TARGET}.py" \
            -max_total_time=300 \
            -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/"
      - name: Upload the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz-artifacts/
          if-no-files-found: ignore

  publish:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build, mutation, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tagged commit is on main
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release: not a full commit SHA: $COMMIT_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "release: $COMMIT_SHA is not on origin/main" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the core
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/core/
          skip-existing: true

  # Each distribution publishes from its own job and environment. PyPI matches a trusted publisher
  # on repository, workflow and environment, so two packages sharing one job share one identity:
  # before a project exists, PyPI then picks one of the two pending publishers for both uploads, and
  # the 0.1.0-beta.1 TestPyPI dry run failed with "Non-user identities cannot create new projects".
  publish-patro:
    name: publish nepdate-patro to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-patro
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tagged commit is on main
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release: not a full commit SHA: $COMMIT_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "release: $COMMIT_SHA is not on origin/main" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish nepdate-patro
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/patro/

  verify:
    name: verify from PyPI
    needs: [preflight, publish-patro]
    permissions:
      contents: read
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.preflight.outputs.pypi-version }}
      index-url: https://pypi.org/simple/
  github-release:
    name: GitHub Release
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Extract the changelog section
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: uv run --locked python scripts/ci.py release-notes "$VERSION" > release-notes.md
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          # A beta or rc tag is a pre-release, so the release page never shows it as latest.
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          files: |
            dist/core/*
            dist/patro/*

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.dry-run
    needs: [preflight, build, mutation, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the core to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/core/
          skip-existing: true

  publish-patro-testpypi:
    name: publish nepdate-patro to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.dry-run
    needs: [preflight, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi-patro
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish nepdate-patro to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/patro/
          skip-existing: true

  verify-testpypi:
    name: verify from TestPyPI
    needs: [preflight, publish-patro-testpypi]
    permissions:
      contents: read
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.preflight.outputs.pypi-version }}
      index-url: https://test.pypi.org/simple/
      # tzdata (Windows) and pip's own build tools are not reliably on TestPyPI.
      extra-index-url: https://pypi.org/simple/