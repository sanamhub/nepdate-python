name: mutation

# The weekly run catches test rot. A pull request that changes the library, its tests or the
# triage files also runs it, so a survivor is caught in review instead of at the release tag.
on:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "src/nepdate/**"
      - "packages/nepdate-patro/src/**"
      - "tests/**"
      - "packages/nepdate-patro/tests/**"
      - "scripts/mutation_check.py"
      - "docs/mutation/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the mutation group
        run: uv sync --all-packages --group mutation
      - name: Use the mutated source, not the editable install
        run: |
          uv pip uninstall nepdate-core nepdate-patro
          cp -r packages/nepdate-patro/src/nepdate_patro src/nepdate_patro
      - name: Run mutmut
        run: .venv/bin/mutmut run --max-children 4
      - name: Export and check the result
        run: |
          .venv/bin/mutmut export-cicd-stats
          .venv/bin/mutmut results --all true > mutants/results.txt
          .venv/bin/python scripts/mutation_check.py mutants/mutmut-cicd-stats.json --results mutants/results.txt
