version: 2
updates:
  # Keeps the pinned action SHAs current. The cooldown gives a bad release two weeks to be pulled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  # Keeps the dev dependency group and the lock file current.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
