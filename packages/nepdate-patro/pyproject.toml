[project]
name = "nepdate-patro"
version = "0.1.0b1"
description = "Tithi, public holidays and events for nepdate (Bikram Sambat calendar)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NepDate contributors" }]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Typing :: Typed",
]
dependencies = [
    "nepdate-core>=0.1.0b1,<0.2",
]

[build-system]
# hatchling, not uv_build: the sdist must carry the patro JSON that _tables.py is generated from,
# and that data lives in the workspace root, outside this project. uv_build cannot include files
# outside the project; hatchling's force-include can, and fails the build when the folder is
# missing (ADR-0011).
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nepdate_patro"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "LICENSE", "NOTICE", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"../../shared/data/patro" = "shared/data/patro"

[tool.uv.sources]
nepdate-core = { workspace = true }
