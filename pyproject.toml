[project]
name = "nepdate-core"
version = "0.1.0b1"
description = "Bikram Sambat (Nepali calendar) for Python, dependency-free and typed"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "shared/data/NOTICE"]
authors = [{ name = "NepDate contributors" }]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Typing :: Typed",
]
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nepdate"
# The sdist carries the calendar source the generated tables come from. source-include does not
# affect the wheel, so the core wheel still has no shared data.
source-include = ["shared/data/calendar/**"]

[tool.mutmut]
source_paths = ["src"]
also_copy = ["shared", "packages/nepdate-patro/tests"]
do_not_mutate = ["*_calendar.py", "*_tables.py"]
pytest_add_cli_args = ["-x", "-q", "--no-header", "-p", "no:cacheprovider", "--import-mode=importlib", "--ignore=tests/test_source_hygiene.py", "--ignore=tests/test_lazy_imports.py", "--ignore=packages/nepdate-patro/tests/test_import_separation.py"]
pytest_add_cli_args_test_selection = ["tests", "packages/nepdate-patro/tests"]

[tool.uv.workspace]
members = ["packages/nepdate-patro"]

[dependency-groups]
bench = [
    "bikram==2.1.4",
    "bikram-sambat==0.2.0",
    "nepali==1.2.0",
    "nepali-calendar-utils==3.1.0",
    "nepali-datetime==1.0.8.5",
    "nepkit==0.4.1 ; python_full_version >= '3.12'",
    "npdatetime==0.2.10",
    "psutil==7.2.2",
    "pybsdate==0.3.2",
    "pyperf==2.10.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.120.0",
]
mutation = [
    "hypothesis==6.170.1",
    "mutmut==3.8.0",
    "pytest-cov==7.1.0",
]
fuzz = [
    "atheris==3.1.0 ; sys_platform == 'linux'",
]
release = [
    "twine==7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "packages/nepdate-patro/src", "scripts", "tests"]
exclude = ["shared"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Generated tables are written by scripts/codegen.py, not hand-formatted.
exclude = ["src/nepdate/_calendar.py", "packages/nepdate-patro/src/nepdate_patro/_tables.py"]

[tool.ruff.lint.per-file-ignores]
# Catalogue test function names are derived from the C# ids and cannot be shortened; the bodies
# assert the exact literal counts of the C# catalogue.
"tests/test_csharp_catalog.py" = ["E501"]
"packages/nepdate-patro/tests/test_csharp_catalog_patro.py" = ["E501", "PLR2004"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests, deselect with -m 'not slow'",
]
